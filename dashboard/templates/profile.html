<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .profile-header {
            text-align: center;
            margin-top: 50px;
        }
        .profile-details {
            margin-top: 30px;
        }
        .profile-container {
            max-width: 600px;
            margin: auto;
        }
        .form-container {
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-container">
            <div class="profile-header">
                <h1>User Profile</h1>
                <h2>{{ user.username }}</h2>
            </div>
            <div class="profile-details">
                <ul class="list-group">
                    <li class="list-group-item"><strong>Username:</strong> {{ user.username }}</li>
                    <li class="list-group-item"><strong>User ID:</strong> {{ user.id }}</li>
                </ul>
            </div>
            <div class="text-center mt-4">
                <a href="/dashboard/" class="btn btn-primary">Back to Dashboard</a>
                <a href="/logout" class="btn btn-danger">Logout</a>
            </div>
        </div>

        <div class="profile-container form-container">
            <h2 class="text-center">Change Password</h2>
            <form id="change-password-form">
                <div class="form-group">
                    <label for="current-password">Current Password</label>
                    <input type="password" class="form-control" id="current-password" placeholder="Enter current password" required>
                </div>
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password" class="form-control" id="new-password" placeholder="Enter new password" required>
                </div>
                <div class="form-group">
                    <label for="confirm-new-password">Confirm New Password</label>
                    <input type="password" class="form-control" id="confirm-new-password" placeholder="Confirm new password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Change Password</button>
            </form>
            <div id="change-password-output" class="mt-3"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#change-password-form').on('submit', function(event) {
                event.preventDefault();

                const currentPassword = $('#current-password').val();
                const newPassword = $('#new-password').val();
                const confirmNewPassword = $('#confirm-new-password').val();

                if (newPassword !== confirmNewPassword) {
                    $('#change-password-output').html(`<div class="alert alert-danger">Passwords do not match.</div>`);
                    return;
                }

                $.ajax({
                    type: 'POST',
                    url: '/change_password',
                    contentType: 'application/json',
                    data: JSON.stringify({ currentPassword, newPassword }),
                    success: function(response) {
                        $('#change-password-output').html(`<div class="alert alert-success">${response.message}</div>`);
                        $('#change-password-form')[0].reset();
                    },
                    error: function(response) {
                        $('#change-password-output').html(`<div class="alert alert-danger">${response.responseJSON.message}</div>`);
                    }
                });
            });
        });
    </script>
</body>
</html>
