<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background-color: #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .navbar-brand {
            font-weight: bold;
        }
        .navbar-nav .nav-link {
            font-size: 18px;
            margin-right: 15px;
        }
        .navbar-nav .nav-link:hover {
            color: #007bff;
        }
        .active .nav-link {
            color: #007bff !important;
        }
        .login-register {
            margin-top: 50px;
            width: 400px;
            background-color: #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .login-register h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .login-register form {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="/">TLHOP/SAM Analytics on EPSS</a>
            <ul class="navbar-nav ml-auto">
                <li class="nav-item {% if active_page == 'signup' %}disabled{% endif %}">
                    <a class="nav-link" href="/signup">Sign up</a>
                </li>
                <li class="nav-item {% if active_page == 'login' %}active{% endif %}">
                    <a class="nav-link" href="/login">Login</a>
                </li>
            </ul>
        </div>
    </nav>
    {% block content %}
    {% endblock %}
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var currentPath = window.location.pathname;
            var activePage = currentPath.split('/').pop();

            var navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(function(link) {
                if (link.getAttribute('href').includes(activePage)) {
                    link.parentElement.classList.add('active');
                }
            });

            var signUpButton = document.querySelector('.nav-item.disabled .nav-link');
            signUpButton.addEventListener('click', function(event) {
                event.preventDefault();
            });
        });
    </script>
</body>
</html>
