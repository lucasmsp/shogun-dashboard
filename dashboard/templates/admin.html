<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Users</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container" style="margin-top: 50px;">
        <div class="row">
            <div class="col-md-6">
                <h2 class="mb-4">Create New User</h2>
                <form id="create-user-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" class="form-control" id="username" placeholder="Enter username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm-password" placeholder="Confirm password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Create User</button>
                </form>
                <div id="create-user-output" class="mt-3"></div>
            </div>

            <div class="col-md-6">
                <h2 class="mb-4">Manage Users</h2>
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script>
        $(document).ready(function() {
            loadUsers();

            $('#create-user-form').on('submit', function(event) {
                event.preventDefault();
                
                const username = $('#username').val();
                const password = $('#password').val();
                const confirmPassword = $('#confirm-password').val();

                if (password !== confirmPassword) {
                    $('#create-user-output').html(`<div class="alert alert-danger">Passwords do not match.</div>`);
                    return;
                }

                $.ajax({
                    type: 'POST',
                    url: '/create_user',
                    contentType: 'application/json',
                    data: JSON.stringify({ username, password }),
                    success: function(response) {
                        $('#create-user-output').html(`<div class="alert alert-success">${response.message}</div>`);
                        $('#create-user-form')[0].reset();
                        loadUsers();
                    },
                    error: function(response) {
                        $('#create-user-output').html(`<div class="alert alert-danger">${response.responseJSON.message}</div>`);
                    }
                });
            });
        });

        function loadUsers() {
            $.ajax({
                type: 'GET',
                url: '/get_users',
                success: function(users) {
                    $('#user-table-body').empty();
                    users.forEach(function(user) {
                        $('#user-table-body').append(`
                            <tr>
                                <td>${user.username}</td>
                                <td>
                                    <button class="btn btn-warning btn-sm" onclick="showChangePasswordModal('${user.username}')">Change Password</button>
                                    <button class="btn btn-danger btn-sm" onclick="showDeleteUserModal('${user.username}')">Delete User</button>
                                </td>
                            </tr>
                        `);
                    });
                }
            });
        }

        function showChangePasswordModal(username) {
            const newPassword = prompt(`Enter new password for ${username}:`);
            if (newPassword) {
                changePassword(username, newPassword);
            }
        }

        function changePassword(username, newPassword) {
            $.ajax({
                type: 'POST',
                url: '/change_password',
                contentType: 'application/json',
                data: JSON.stringify({ username, newPassword }),
                success: function(response) {
                    alert(response.message);
                    loadUsers();
                },
                error: function(response) {
                    alert(response.responseJSON.message);
                }
            });
        }

        // Block admin deletion
        function showDeleteUserModal(username) {
            if (username === 'admin') {
                alert('The admin user cannot be deleted.');
                return;
            }
            const confirmation = prompt(`Type the username "${username}" to confirm deletion:`);
            if (confirmation === username) {
                deleteUser(username);
            } else {
                alert('Username does not match. Deletion cancelled.');
            }
        }

        function deleteUser(username) {
            $.ajax({
                type: 'POST',
                url: '/delete_user',
                contentType: 'application/json',
                data: JSON.stringify({ username }),
                success: function(response) {
                    alert(response.message);
                    loadUsers();
                },
                error: function(response) {
                    alert(response.responseJSON.message);
                }
            });
        }
    </script>
</body>
</html>
