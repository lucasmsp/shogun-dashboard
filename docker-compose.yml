version: "3"

services:
  dashboard:
    build: .
    image: lucasmsp/tlhop-dashboard:latest
    volumes:
      - ./input_data:/opt/input_data/
      - ./output_data:/opt/output_data/
    networks:
      - default
    ports:
      - 8080:8080
      - 4040:4040
    command: python3 app.py --host 0.0.0.0 --port 8080 --scan False
    environment:
      - CRON_EXPRESSION=*/1 * * * *
      - SPARK_UI_PORT=4040
      - SPARK_VCORES=6
      - SPARK_MEMORY=4g  
      - SHODAN_FOLDER=/opt/input_data/
      - RESULT_FOLDER=/opt/output_data/
      - TLHOP_DATASETS_PATH=/opt/output_data/tlhop_datasets/
      - POSTGRES_URL=postgres:5432
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - FLASK_SECRET=XXXXXXXXXXXXXXXX
      # A good recipe to generate FLASK_SECRET is copy the content of `import os; os.urandom(24)`
    env_file: local/env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: tlhop_postgres
    image: postgres:latest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - default
    env_file: local/env
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
    driver: local
